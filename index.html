<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Bar Tenders - GeM Open Bids</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14212e;--mute:#5a6b7b;--line:#d5dde5;--navy:#0e2a47;--accent:#1f6fb2;--hot:#d9601a;--red:#c0392b;--ok:#1e8a5a;--chip:#e3eaf1}
@media (prefers-color-scheme:dark){:root{--bg:#0d141b;--card:#16212c;--ink:#e8eef4;--mute:#97a7b6;--line:#26333f;--navy:#08192c;--accent:#5ea6e0;--hot:#f0883e;--red:#ef6b5c;--ok:#4fc58b;--chip:#1f2c39}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--navy),#1b4a78);color:#fff;padding:22px 16px 20px}
.w{max-width:860px;margin:0 auto}h1{font:700 1.65rem/1.2 Georgia,serif;margin:0 0 4px}
header p{margin:0;opacity:.85;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:1.5rem;line-height:1.1}.stat span{font-size:.78rem;opacity:.85}
main{padding:16px}.note{background:var(--card);border-left:4px solid var(--red);padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:.9rem;display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}input{flex:1 1 200px}select{flex:0 1 170px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.lb{font-size:.8rem;color:var(--mute);width:100%;margin-top:4px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.cnt{color:var(--mute);font-size:.9rem;margin:12px 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.item.soon{border-left:5px solid var(--red)}.item.new{border-left:5px solid var(--ok)}
.t{font-weight:650;margin:0 0 8px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tg{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip)}
.tg.m{background:var(--accent);color:#fff}.tg.n{background:var(--ok);color:#fff}.tg.s{background:var(--red);color:#fff}
.m2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;font-size:.88rem;color:var(--mute)}.m2 b{color:var(--ink);font-weight:600}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:.9rem;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
</style></head><body>
<header><div class="w"><h1>Steel Bar Tenders</h1>
<p>Open GeM bids only: SS 300/400 series, Titanium, MS. Round, Hex, Square, Flat bars.</p>
<div class="stats"><div class="stat"><b id="s1">0</b><span>Open bids</span></div><div class="stat"><b id="s2">0</b><span>New (2 days)</span></div><div class="stat"><b id="s3">0</b><span>Closing in 3 days</span></div></div>
<p style="margin-top:10px;font-size:.8rem">Updated: <span id="u">...</span></p></div></header>
<main><div class="w">
<div class="note" id="nt">Today's GeM fetch did not work. Showing the last saved open bids.</div>
<div class="bar"><input id="q" type="search" placeholder="Search grade, buyer, bid no (e.g. 316, BHEL)" aria-label="Search">
<select id="so" aria-label="Sort"><option value="end">Closing soonest</option><option value="new">Newest first</option></select></div>
<div class="chips" id="c1"></div><div class="chips" id="c2"></div>
<p class="cnt" id="cnt"></p><div id="l"></div>
</div></main>
<script>
var B=[],S={q:"",mat:"",sh:"",so:"end"};
var T=new Date(Date.now()+19800000).toISOString().slice(0,10);
function dd(a,b){return Math.round((new Date(a)-new Date(b))/864e5)}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(d){var p=(d||"").split("-");return p.length===3?p[2]+"-"+p[1]+"-"+p[0]:"-"}
function open(){return B.filter(function(b){return b.end&&b.end>=T})}
var MATS=["SS 300","SS 400","SS","Titanium","MS"],SHP=["Round","Hex","Square","Flat"];
function chips(id,list,key,all){var o=open(),h='';
 h+='<span class="lb">'+(key==="mat"?"Material":"Shape")+'</span>';
 [""].concat(list).forEach(function(v){var n=o.filter(function(b){return v===""||b[key==="mat"?"mat":"shape"]===v}).length;
  if(v!==""&&n===0)return;
  h+='<button class="chip" data-k="'+key+'" data-v="'+v+'" aria-pressed="'+(S[key]===v)+'">'+(v||all)+' ('+n+')</button>'});
 document.getElementById(id).innerHTML=h;
 [].forEach.call(document.getElementById(id).querySelectorAll(".chip"),function(b){b.onclick=function(){S[b.dataset.k]=b.dataset.v;draw()}})}
function draw(){
 var o=open(),q=S.q.toLowerCase();
 document.getElementById("s1").textContent=o.length;
 document.getElementById("s2").textContent=o.filter(function(b){return b.start&&dd(T,b.start)<=2}).length;
 document.getElementById("s3").textContent=o.filter(function(b){return dd(b.end,T)<=3}).length;
 chips("c1",MATS,"mat","All");chips("c2",SHP,"sh","All");
 var r=o.filter(function(b){return (!S.mat||b.mat===S.mat)&&(!S.sh||b.shape===S.sh)&&(!q||(b.item+" "+b.buyer+" "+b.bid_no+" "+b.mat).toLowerCase().indexOf(q)>-1)});
 r.sort(function(a,b){return S.so==="new"?(b.start||"").localeCompare(a.start||""):a.end.localeCompare(b.end)});
 document.getElementById("cnt").textContent=r.length+" open bid"+(r.length===1?"":"s");
 document.getElementById("l").innerHTML=r.length?r.map(function(b,i){var dl=dd(b.end,T),nw=b.start&&dd(T,b.start)<=2;
  var link=b.id&&b.id!=="undefined"&&b.id!==""?"https://bidplus.gem.gov.in/showbidDocument/"+encodeURIComponent(b.id):"https://bidplus.gem.gov.in/all-bids";
  return '<article class="item'+(dl<=3?' soon':nw?' new':'')+'"><p class="t">'+esc(b.item)+'</p><div class="tags"><span class="tg m">'+esc(b.mat)+'</span><span class="tg">'+(b.shape==="Bar"?"Bar":esc(b.shape)+" bar")+'</span>'
  +(nw?'<span class="tg n">New</span>':'')+(dl<=3?'<span class="tg s">'+(dl<=0?'Closes today':'Closes in '+dl+' day'+(dl>1?'s':''))+'</span>':'')+'</div>'
  +'<div class="m2"><span>Buyer: <b>'+esc(b.buyer||"-")+'</b></span><span>Qty: <b>'+esc(b.qty||"-")+'</b></span><span>Posted: <b>'+fm(b.start)+'</b></span><span>Last date: <b>'+fm(b.end)+'</b></span><span>Bid no: <b>'+esc(b.bid_no)+'</b></span></div>'
  +'<div class="act"><a class="btn p" href="'+link+'" target="_blank" rel="noopener">View on GeM</a><button class="btn" data-c="'+esc(b.bid_no)+'">Copy bid no</button></div></article>'}).join(""):'<div class="empty"><p><b>No open bids match right now.</b></p><p>New bids appear here every morning.</p><a class="btn p" href="https://bidplus.gem.gov.in/all-bids" target="_blank" rel="noopener">Search on GeM</a></div>';
 [].forEach.call(document.querySelectorAll("[data-c]"),function(b){b.onclick=function(){try{navigator.clipboard.writeText(b.dataset.c);b.textContent="Copied"}catch(e){b.textContent=b.dataset.c}}})}
document.getElementById("q").oninput=function(){S.q=this.value;draw()};
document.getElementById("so").onchange=function(){S.so=this.value;draw()};
fetch("data.json").then(function(r){return r.json()}).then(function(d){B=d.bids||[];document.getElementById("u").textContent=d.updated;if(d.status==="blocked")document.getElementById("nt").style.display="block";draw()}).catch(function(){draw()});
</script></body></html>
